<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ff66">
  <meta name="description" content="BRcode — comunicação, comunidades e amigos.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BRcode</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="brand"><div class="logo">BR</div><h1>BRcode</h1><p>Conecte. Converse. Compartilhe.</p></section>
    <section id="auth" class="card">
      <h2>Entrar no BRcode</h2>
      <input id="user" placeholder="Usuário" autocomplete="username">
      <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
      <button id="login">Entrar</button>
      <button id="register" class="secondary">Criar conta</button>
      <p id="status" class="status"></p>
    </section>
    <section id="home" class="home hidden">
      <header><strong>BRcode</strong><button id="logout" class="secondary">Sair</button></header>
      <div class="grid">
        <button>💬<span>Chat</span></button><button>🎙️<span>Voz</span></button><button>📹<span>Vídeo</span></button>
        <button>🏠<span>Comunidades</span></button><button>👥<span>Amigos</span></button><button>🤖<span>Bots</span></button>
        <button>📎<span>Arquivos</span></button><button>🛡️<span>Moderação</span></button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
