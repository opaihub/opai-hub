<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07100d">
<title>BRcode</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050909;color:#edf7f2;font-family:Inter,Segoe UI,Arial,sans-serif}.login-page{min-height:100vh;display:flex;position:relative;overflow:hidden;background:radial-gradient(circle at 80% 20%,#073d26 0,transparent 34%),linear-gradient(135deg,#020505,#07120e 55%,#020504)}.login-page:before{content:"";position:absolute;inset:0;opacity:.18;background:linear-gradient(125deg,transparent 20%,#16f57a 21%,transparent 23%,transparent 67%,#16f57a 68%,transparent 70%);pointer-events:none}.marketing{width:43%;padding:58px 7%;position:relative;z-index:1}.brand{font-size:36px;letter-spacing:-2px;display:flex;align-items:center;gap:7px}.brand b,.card-logo b{color:#20f57b}.bolt{display:inline-grid;place-items:center;width:42px;height:42px;color:#fff;background:linear-gradient(145deg,#21f57b,#14a95c);clip-path:polygon(35% 0,100% 0,63% 40%,88% 40%,24% 100%,38% 52%,10% 52%)}.tagline{font-size:20px;line-height:1.45;color:#aebcb7;letter-spacing:2px;margin:24px 0 52px}.feature-list{display:grid;gap:24px}.feature{display:flex;gap:16px;align-items:center}.feature-icon{width:48px;height:48px;border:1px solid #13e873;border-radius:13px;display:grid;place-items:center;font-size:21px;box-shadow:0 0 18px #0ac95d33}.feature b,.feature small{display:block}.feature small{color:#91a29b;margin-top:5px}.slogan{margin-top:55px;color:#19f274;font-size:18px;font-weight:800;transform:rotate(-5deg);letter-spacing:2px}.login-card{position:relative;z-index:2;width:min(570px,90%);margin:auto 7% auto 0;padding:42px 46px;border:1px solid #164b36;border-radius:24px;background:linear-gradient(145deg,#08100eeb,#050909f2);box-shadow:0 0 70px #00ff7a12,inset 0 0 40px #0d35221c}.card-logo{font-size:34px;text-align:center;margin-bottom:28px}.login-card h1{font-size:31px;margin:0 0 8px}.login-card h1 em{color:#22f57c;font-style:normal}.subtitle{color:#9cacaa;margin:0 0 22px}.tabs{display:flex;border:1px solid #20352d;border-radius:13px;padding:3px;margin-bottom:20px}.tab{flex:1;border:0;background:transparent;color:#c8d3cf;padding:12px;border-radius:10px;font-size:16px;cursor:pointer}.tab.active{background:#063d25;color:#25f57e;box-shadow:inset 0 0 0 1px #15e86e}.login-card form{display:grid;gap:13px}.login-card form>label{display:flex;align-items:center;gap:12px;border:1px solid #263832;background:#0b1110;border-radius:13px;padding:0 15px;height:55px}.login-card form>label:focus-within{border-color:#16ed72;box-shadow:0 0 0 3px #16ed7214}.login-card input{width:100%;background:none;border:0;outline:0;color:white;font-size:16px}.login-card input::placeholder{color:#71807b}.eye{background:none;border:0;color:#8da29a;cursor:pointer}.options{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#9caeaa}.check{display:flex;gap:8px;align-items:center}.check input{accent-color:#19ed73;width:18px;height:18px}.link{border:0;background:none;color:#24f57b;cursor:pointer;text-decoration:underline;font-size:inherit}.primary{width:100%;border:0;border-radius:13px;background:linear-gradient(90deg,#12db62,#35f777);color:#03130b;font-weight:800;font-size:17px;padding:16px;cursor:pointer;box-shadow:0 8px 28px #14ed6c2e}.error{padding:10px 12px;border-radius:10px;background:#4d1515;color:#ffb4b4;border:1px solid #9e3232;font-size:14px}.or{display:flex;align-items:center;gap:14px;color:#7d8d88;margin:22px 0}.or:before,.or:after{content:"";height:1px;background:#26352f;flex:1}.google{width:100%;padding:14px;border:1px solid #2a3934;border-radius:13px;background:#0b1110;color:#e7eeeb;font-size:16px;cursor:pointer}.switch{text-align:center;color:#899893}.demo{text-align:center;color:#53645e;font-size:12px;margin-top:20px}.app-shell{min-height:100vh;display:flex;background:#050909}.sidebar{width:76px;border-right:1px solid #15382a;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:14px}.brand.small{font-size:15px;margin-bottom:10px}.brand.small .bolt{width:30px;height:30px}.server{width:48px;height:48px;border-radius:16px;border:1px solid #174b35;display:grid;place-items:center;color:#bde8d3;background:#09110f;font-weight:800;font-size:20px}.server.active{background:#0bd96b;color:#03130b}.home{flex:1}.topbar{height:64px;border-bottom:1px solid #15382a;padding:0 28px;display:flex;justify-content:space-between;align-items:center}.topbar span{color:#789088;margin-left:10px}.status{color:#21f57b}.welcome-card{max-width:1000px;margin:70px auto;padding:50px;border:1px solid #145d3d;border-radius:24px;background:radial-gradient(circle at 50% 0,#0b4a2b55,transparent 50%),#07100d}.hero-logo{margin:auto;width:90px;height:90px;border-radius:28px;display:grid;place-items:center;background:#0de76f;color:white;font-size:34px}.welcome-card h1{text-align:center;font-size:36px;margin:25px 0 8px}.welcome-card>p{text-align:center;color:#9cafaa}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:35px 0}.quick-grid div{padding:20px;border:1px solid #194b36;border-radius:15px;background:#091410}.quick-grid b,.quick-grid small{display:block}.quick-grid small{color:#83968e;margin-top:8px}.bg-glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.13;background:#00ff73}.glow-one{left:30%;top:-150px}.glow-two{right:-100px;bottom:-180px}@media(max-width:950px){.marketing{display:none}.login-card{margin:auto}.quick-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const demo=[{username:'Caua_',password:'123456'},{username:'zSnow',password:'123456'}];
let user=JSON.parse(localStorage.getItem('brcode_user')||'null'),mode='login',show=false,error='';
function render(){document.getElementById('root').innerHTML=user?home():login();bind()}
function login(){const saved=JSON.parse(localStorage.getItem('brcode_demo_account')||'null');user={username:window._loginName||''};localStorage.setItem('brcode_user',JSON.stringify(user));render()}
function loginPage(){return `<div class="login-page"><div class="bg-glow glow-one"></div><div class="bg-glow glow-two"></div><section class="marketing"><div class="brand"><span class="bolt">ϟ</span><b>BR</b>code</div><p class="tagline">Conectando pessoas,<br>criando comunidades.</p><div class="feature-list">${[['💬','Chat em tempo real','Converse com amigos e comunidades.'],['👥','Comunidades','Encontre pessoas com os mesmos interesses.'],['🎙️','Voz e vídeo','Fale e se conecte de forma fácil.'],['🤖','Bots e automações','Deixe tudo mais prático e divertido.'],['🛡️','Segurança','Sua privacidade é nossa prioridade.']].map(x=>`<div class="feature"><div class="feature-icon">${x[0]}</div><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div><div class="slogan">JUNTOS<br>SOMOS MAIS<br>FORTES</div></section><section class="login-card"><div class="card-logo"><span class="bolt">ϟ</span><b>BR</b>code</div><h1>${mode==='login'?'Bem-vindo <em>de volta!</em>':'Crie sua <em>conta</em>'}</h1><p class="subtitle">${mode==='login'?'Faça login na sua conta para continuar.':'É rápido e fácil. Crie sua conta para começar.'}</p><div class="tabs"><button class="tab ${mode==='login'?'active':''}" id="loginTab">Entrar</button><button class="tab ${mode==='register'?'active':''}" id="registerTab">Cadastrar</button></div><form id="form"><label>♙<input id="username" placeholder="Usuário ou e-mail" autocomplete="username"></label>${mode==='register'?'<label>✉<input id="email" type="email" placeholder="E-mail" autocomplete="email"></label>':''}<label>▣<input id="password" type="${show?'text':'password'}" placeholder="Senha" autocomplete="${mode==='login'?'current-password':'new-password'}"><button type="button" class="eye" id="eye">${show?'◉':'◌'}</button></label>${mode==='login'?'<div class="options"><label class="check"><input id="remember" type="checkbox" checked> Lembrar de mim</label><button type="button" class="link" id="forgot">Esqueceu sua senha?</button></div>':''}${error?`<div class="error">${error}</div>`:''}<button class="primary" type="submit">${mode==='login'?'Entrar  →':'Criar conta  →'}</button></form><div class="or"><span>ou</span></div><button class="google" id="google">🌈 &nbsp; Continuar com o Google</button><p class="switch">${mode==='login'?'Não tem uma conta? ':'Já tem uma conta? '}<button class="link" id="switch">${mode==='login'?'Criar conta':'Entrar'}</button></p><p class="demo">Demo local: <b>Caua_</b> / <b>123456</b></p></section></div>`}
function login(){return loginPage()}
function home(){return `<div class="app-shell"><aside class="sidebar"><div class="brand small"><span class="bolt">ϟ</span><b>BR</b>code</div><div class="server active">B</div><div class="server">⌂</div><div class="server">🎮</div><div class="server">+</div></aside><main class="home"><header class="topbar"><div><b>BRcode</b><span>Conectando pessoas, criando comunidades.</span></div><div class="status">● Online</div></header><section class="welcome-card"><div class="hero-logo"><span class="bolt">ϟ</span></div><h1>Bem-vindo ao BRcode, ${user.username}! 👋</h1><p>Seu espaço para conversar, jogar e criar comunidades.</p><div class="quick-grid"><div><b>💬 Chat</b><small>Converse em tempo real</small></div><div><b>🎙️ Voz</b><small>Entre em salas com seus amigos</small></div><div><b>👥 Comunidades</b><small>Encontre pessoas com os mesmos interesses</small></div><div><b>🤖 Bots</b><small>Automatize sua comunidade</small></div></div><button class="primary" id="logout">Sair da conta</button></section></main></div>`}
function bind(){if(user){document.getElementById('logout').onclick=()=>{localStorage.removeItem('brcode_user');user=null;render()};return}document.getElementById('loginTab').onclick=()=>{mode='login';error='';render()};document.getElementById('registerTab').onclick=()=>{mode='register';error='';render()};document.getElementById('switch').onclick=()=>{mode=mode==='login'?'register':'login';error='';render()};document.getElementById('eye').onclick=()=>{show=!show;render()};document.getElementById('google').onclick=()=>{error='Login com Google será conectado na próxima etapa.';render()};if(document.getElementById('forgot'))document.getElementById('forgot').onclick=()=>{error='Recuperação de senha será conectada ao backend.';render()};document.getElementById('form').onsubmit=e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||!p){error='Preencha usuário/e-mail e senha.';return render()}if(p.length<6){error='A senha precisa ter pelo menos 6 caracteres.';return render()}if(mode==='register'){const em=document.getElementById('email').value.trim();if(!em){error='Informe um e-mail para criar a conta.';return render()}localStorage.setItem('brcode_demo_account',JSON.stringify({username:u,password:p,email:em}));window._loginName=u;return login()}const saved=JSON.parse(localStorage.getItem('brcode_demo_account')||'null');const valid=demo.some(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p)||(saved&&saved.username.toLowerCase()===u.toLowerCase()&&saved.password===p);if(!valid){error='Usuário ou senha inválidos. Demo: Caua_ / 123456';return render()}window._loginName=u;login()}}
render();
</script>
</body>
</html>
