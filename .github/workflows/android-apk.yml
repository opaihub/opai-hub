name: Build BRcode APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRcode-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 android/app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.1.0 android/app/build/outputs/apk/debug/app-debug.apk --title 'BRcode Android 0.1.0' --notes 'Primeira versão Android instalável do BRcode.' --latest
          fi
